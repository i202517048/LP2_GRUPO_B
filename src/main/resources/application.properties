spring.application.name=HotelMorfeo


# Server configuration
# If server.port is not specified, Spring Boot uses port 8080 by default.
server.port=8081

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate

# Zona JDBC utilizada por Hibernate
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# MySQL database configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.url=jdbc:mysql://localhost:3306/hotel_morfeo?useSSL=false&serverTimezone=UTC
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_morfeo_propuesta_bd?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysql123


# Locale configuration
spring.web.locale=es_PE
spring.web.locale-resolver=fixed
