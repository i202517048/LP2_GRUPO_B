<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<title>Hotel Morfeo - Acceso del Personal</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" />
</head>

<body>
	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-md-5">
				<div class="card shadow-lg">
					<div class="card-body">
						<h1 class="card-title text-center">
							Hotel Morfeo
						</h1>

						<p class="text-center">
							Acceso del personal
						</p>

						<div th:if="${error != null}" th:text="${error}" class="alert alert-danger" role="alert">
						</div>

						<div th:if="${param.logout != null}" class="alert alert-success" role="status">
							Sesión cerrada correctamente.
						</div>

						<form th:action="@{/login}" method="post" class="row g-3">

							<div class="col-md-12">
								<label for="cuenta" class="form-label">
									Cuenta
								</label>

								<input type="text" id="cuenta" name="cuenta" th:value="${cuenta}" class="form-control"
									maxlength="45" autocomplete="username" required>
							</div>

							<div class="col-md-12">
								<label for="clave" class="form-label">
									Contraseña
								</label>

								<input type="password" id="clave" name="clave" class="form-control"
									autocomplete="current-password" required>
							</div>

							<div class="col-md-12">
								<button type="submit" class="btn btn-primary w-100">
									Ingresar
								</button>
							</div>
						</form>

					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
