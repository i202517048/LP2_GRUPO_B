<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/layout :: layoutBase(~{::contenido}, ~{::title})}">

<head>
	<title>Hotel Morfeo - Listado de Huéspedes</title>
</head>

<body>
	<div th:fragment="contenido">

		<div class="container-fluid px-0">
			<div class="card shadow-lg">
				<div class="card-body">
					<div class="row">
						<div class="col-md-10">
							<h1 class="card-title">Listado de Huéspedes</h1>
						</div>
						<div class="col-md-2">
							<a th:href="@{/huespedes/nuevo}" class="btn btn-success w-100">
								<i class="fa-solid fa-plus"></i> Nuevo
							</a>
						</div>
					</div>

					<div class="table-responsive overflow-auto" style="max-height: 70vh;">
						<table class="table table-hover">
							<thead class="table-dark text-center">
								<tr class="position-sticky top-0">
									<th>Id</th>
									<th>Nombres</th>
									<th>Apellidos</th>
									<th>Documento</th>
									<th>Teléfono</th>
									<th>Correo electrónico</th>
									<th>Estado</th>
									<th>Acciones</th>
								</tr>
							</thead>
							<tbody class="table-secondary">
								<tr th:each="item : ${lstHuespedes}">
									<td th:text="${item.idHuesped}" class="text-center"></td>
									<td th:text="${item.nombres}"></td>
									<td th:text="${item.apellidos}"></td>
									<td th:text="${item.documento}" class="text-center"></td>
									<td th:text="${#strings.isEmpty(item.telefono)
                                            ? '-' : item.telefono}" class="text-center"></td>
									<td th:text="${#strings.isEmpty(item.email)
                                            ? '-' : item.email}"></td>
									<td th:text="${item.activoDescripcion}" class="text-center"></td>
									<td>
										<div class="d-flex justify-content-evenly align-items-center gap-3">
											<a th:href="@{/huespedes/edicion/{id}(id=${item.idHuesped})}"
												class="btn btn-outline-primary" title="Editar huésped"
												aria-label="Editar huésped">
												<i class="fa-regular fa-pen-to-square"></i>
											</a>

											<!-- Solo para administrador -->
											<form th:action="@{/huespedes/estado}"
												th:if="${session.usuarioSesion != null and session.usuarioSesion.idRol == 3}"
												method="post" class="m-0">
												<input type="hidden" name="id" th:value="${item.idHuesped}">
												<div class="form-check form-switch">
													<input class="form-check-input" type="checkbox" role="switch"
														th:checked="${item.activoHuespedes == 1}"
														th:attr="aria-label=|Cambiar activación de ${item.fullName}|"
														onchange="this.form.requestSubmit()">
												</div>
											</form>

										</div>
									</td>
								</tr>
								<tr th:if="${#lists.isEmpty(lstHuespedes)}">
									<td colspan="8" class="text-center">
										No hay huéspedes registrados.
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>

	</div>
</body>

</html>
