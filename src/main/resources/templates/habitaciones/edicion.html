
<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>Hotel Morfeo - Editar Habitación</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-body">

                <h1 class="card-title text-center mb-4">
                    Editar Habitación
                </h1>
                <div th:if="${error != null}"
                     th:text="${error}"
                     class="alert alert-danger">
                </div>

                <div class="row d-flex justify-content-center">
                    <div class="col-md-6">

                        <form th:action="@{/habitaciones/grabar}"
                              th:object="${habitacion}"
                              method="post"
                              class="row g-2">

                            <input type="hidden"
                                   th:field="*{idHabitacion}">

                            <div class="col-md-6 position-relative">
                                <label class="form-label">
                                    Número de habitación
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-door-closed"></i>
                                    </span>

                                    <input type="text"
                                           th:field="*{numero}"
                                           class="form-control"
                                           maxlength="10"
                                           required>
                                </div>
                            </div>

                            <div class="col-md-6 position-relative">
                                <label class="form-label">
                                    Tipo de habitación
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-bed"></i>
                                    </span>

                                    <select th:field="*{tipo}"
                                            class="form-select"
                                            required>

                                        <option value="">
                                            --Seleccione--
                                        </option>

                                        <option value="S">Simple</option>
                                        <option value="D">Doble</option>

                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6 position-relative">
                                <label class="form-label">
                                    Precio por noche (S/)
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-money-bill-wave"></i>
                                    </span>

                                    <input type="number"
                                           th:field="*{precioNoche}"
                                           class="form-control"
                                           min="0.01"
                                           max="99999999.99"
                                           step="0.01"
                                           required>
                                </div>
                            </div>

                            <div class="col-md-6 position-relative">
                                <label class="form-label">
                                    Estado
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-circle-info"></i>
                                    </span>

                                    <input type="text"
                                           th:field="*{estado}"
                                           class="form-control"
                                           maxlength="1"
                                           required>
                                </div>
                            </div>

                            <div class="col-md-12 d-flex justify-content-between mt-2">

                                <a th:href="@{/habitaciones/listado}"
                                   class="btn btn-outline-dark">
                                    <i class="fa-solid fa-reply"></i>
                                    Regresar
                                </a>
                                <button type="submit"
                                        class="btn btn-primary">
                                    <i class="fa-solid fa-floppy-disk"></i>
                                    Grabar
                                </button>
                                <button type="reset"
                                        class="btn btn-secondary">
                                    <i class="fa-solid fa-broom"></i>
                                    Limpiar
                                </button>

                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
