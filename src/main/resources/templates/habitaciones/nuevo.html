<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layoutBase(~{::contenido}, ~{::title})}">
<head>
    <title>Hotel Morfeo - Nueva Habitación</title>
</head>
<body>
    <div th:fragment="contenido">


    <div class="container-fluid px-0">
        <div class="card shadow-lg">
            <div class="card-body">

                <h1 class="card-title text-center mb-4">
                    Registrar Habitación
                </h1>

                <div th:if="${error != null}"
                     th:text="${error}"
                     class="alert alert-danger">
                </div>

                <div class="row d-flex justify-content-center">
                    <div class="col-md-6">

                        <form th:action="@{/habitaciones/registrar}"
                              th:object="${habitacion}"
                              method="post"
                              class="row g-2">

                            <div class="col-md-6">
                                <!-- Asociar etiqueta al campo -->
                                <label for="numero" class="form-label">
                                    Número de habitación
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-door-closed"></i>
                                    </span>

                                    <input type="text"
                                           th:field="*{numero}"
                                           class="form-control"
                                           placeholder="Ej. 501"
                                           maxlength="10"
                                           required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <!-- Asociar etiqueta al campo -->
                                <label for="tipo" class="form-label">
                                    Tipo de habitación
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-bed"></i>
                                    </span>

                                    <select th:field="*{tipo}"
                                            class="form-select"
                                            required>

                                        <option value="">
                                            --Seleccione--
                                        </option>

                                        <option value="S">Simple</option>
                                        <option value="D">Doble</option>
                                    </select>
                                </div>
                            </div>
							
                            <div class="col-md-6">
                                <!-- Asociar etiqueta al campo -->
                                <label for="precioNoche" class="form-label">
                                    Precio por noche (S/)
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-money-bill-wave"></i>
                                    </span>

                                    <input type="number"
                                           th:field="*{precioNoche}"
                                           class="form-control"
                                           placeholder="0.00"
                                           min="0.01"
                                           max="99999999.99"
                                           step="0.01"
                                           required>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <!-- Etiqueta del estado informativo -->
                                <label for="estadoVista" class="form-label">
                                    Estado
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fa-solid fa-circle-info"></i>
                                    </span>

                                    <!-- Estado inicial informativo; no se envia -->
                                    <input type="text"
                                           id="estadoVista"
                                           value="Disponible"
                                           class="form-control"
                                           aria-describedby="notaEstado"
                                           readonly>
                                </div>
								
                                <!-- Regla de registro del servicio -->
                                <div id="notaEstado" class="form-text">
                                    Se registrará disponible y activa.
                                </div>

                            </div>

                            <div class="col-md-12 d-flex justify-content-between mt-3">

                                <a th:href="@{/habitaciones/listado}"
                                   class="btn btn-outline-dark">
                                    <i class="fa-solid fa-reply"></i>
                                    Regresar
                                </a>

                                <button type="submit"
                                        class="btn btn-primary">
                                    <i class="fa-solid fa-floppy-disk"></i>
                                    Registrar
                                </button>

                                <button type="reset"
                                        class="btn btn-secondary">
                                    <i class="fa-solid fa-broom"></i>
                                    Limpiar
                                </button>

                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>


    </div>
</body>
</html>
