<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<title>Hotel Morfeo - Habitaciones</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" />

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
</head>

<body>
	<div class="container mt-5">
		<div class="card shadow-lg">
			<div class="card-body">
				<div class="row">
					<div class="col-md-12">
						<h1 class="card-title">Listado de Habitaciones</h1>
					</div>
				</div>

				<div class="table-responsive overflow-auto" style="max-height: 70vh;">
					<table class="table table-hover">
						<thead class="table-dark text-center">
							<tr class="position-sticky top-0">
								<th>Id</th>
								<th>Número</th>
								<th>Tipo</th>
								<th>Precio por noche (S/)</th>
								<th>Estado</th>
								<th>Activo</th>
							</tr>
						</thead>

						<tbody class="table-secondary">
							<tr th:each="item : ${lstHabitaciones}">
								<td th:text="${item.idHabitacion}" class="text-center"></td>

								<td th:text="${item.numero}" class="text-center"></td>

								<td th:text="${item.tipo}" class="text-center"></td>

								<td th:text="${#numbers.formatDecimal(item.precioNoche, 1, 2)}" class="text-end"></td>

								<td th:text="${item.estado}" class="text-center"></td>

								<td th:text="${item.activoHabitaciones == null
                                    ? 'Sin definir'
                                    : (item.activoHabitaciones ? 'Sí' : 'No')}" class="text-center"></td>
							</tr>

							<tr th:if="${#lists.isEmpty(lstHabitaciones)}">
								<td colspan="6" class="text-center">
									No hay habitaciones registradas.
								</td>
							</tr>
						</tbody>
					</table>
				</div>

				<a th:href="@{/reserva/listado}" class="btn btn-outline-dark">
					<i class="fa-solid fa-reply"></i>
					Regresar a reservas
				</a>
			</div>
		</div>
	</div>
</body>

</html>
