<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layoutBase(~{::contenido}, ~{::title})}">
<head>
    <title>Hotel Morfeo - Habitaciones</title>
</head>
<body>
    <div th:fragment="contenido">


    <div class="container-fluid px-0">
        <div class="card shadow-lg">
            <div class="card-body">

                <div class="row">
                    <div class="col-md-10">
                        <h1 class="card-title">
                            Listado de Habitaciones
                        </h1>
                    </div>

                    <div class="col-md-2">
                        <a th:href="@{/habitaciones/nuevo}"
                           class="btn btn-success w-100">
                            <i class="fa-solid fa-plus"></i>
                            Nuevo
                        </a>
                    </div>
                </div>

                <div class="table-responsive overflow-auto"
                     style="max-height: 70vh;">

                    <table class="table table-hover">

                        <thead class="table-dark text-center">
                            <tr class="position-sticky top-0">
                                <th>Id</th>
                                <th>Número</th>
                                <th>Tipo</th>
                                <th>Precio por noche (S/)</th>
                                <th>Estado</th>
                                <th>Activación</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody class="table-secondary">

                            <tr th:each="item : ${lstHabitaciones}">

                                <td th:text="${item.idHabitacion}"
                                    class="text-center"></td>

                                <td th:text="${item.numero}"
                                    class="text-center"></td>

                                <!-- Descripcion del tipo -->
                                <td th:text="${item.tipoDescripcion}"
                                    class="text-center"></td>

                                <td th:text="${#numbers.formatDecimal(item.precioNoche, 1, 2)}"
                                    class="text-center"></td>

                                <!-- Descripciones de ocupacion y activacion -->
                                <td th:text="${item.estadoDescripcion}"
                                    class="text-center"></td>

                                <td th:text="${item.activoDescripcion}"
                                    class="text-center"></td>

                                <td>
                                    <div class="d-flex justify-content-evenly align-items-center">

                                        <a th:href="@{/habitaciones/edicion/{id}(id=${item.idHabitacion})}"
                                           class="btn btn-outline-primary"
                                           title="Editar"
                                           aria-label="Editar">

                                            <i class="fa-regular fa-pen-to-square"></i>
                                        </a>

                                        <form th:action="@{/habitaciones/estado}"
                                              method="post"
                                              class="m-0">

                                            <input type="hidden"
                                                   name="id"
                                                   th:value="${item.idHabitacion}">

                                            <div class="form-check form-switch">
                                                <input class="form-check-input"
                                                       type="checkbox"
                                                       role="switch"
                                                       th:checked="${item.activoHabitaciones == true}"
                                                       th:attr="aria-label=|Cambiar activación de habitación ${item.numero}|"
                                                       onchange="this.form.requestSubmit()">
                                            </div>

                                        </form>

                                    </div>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(lstHabitaciones)}">
                                <td colspan="7" class="text-center">
                                    No hay habitaciones registradas.
                                </td>
                            </tr>

                        </tbody>
                    </table>
                </div>

                <a th:href="@{/reserva/listado}"
                   class="btn btn-outline-dark">

                    <i class="fa-solid fa-reply"></i>
                    Regresar a reservas
                </a>

            </div>
        </div>
    </div>


    </div>
</body>
</html>
